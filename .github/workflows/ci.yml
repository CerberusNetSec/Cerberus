name: CI

on:
  push:
    branches: [main, cluster]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  clustered-storage:
    name: clustered storage (PostgreSQL + ClickHouse)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: cerberus, POSTGRES_PASSWORD: citest, POSTGRES_DB: cerberus}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cerberus" --health-interval 5s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env: {CLICKHOUSE_USER: cerberus, CLICKHOUSE_PASSWORD: citest, CLICKHOUSE_DB: cerberus}
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user cerberus --password citest --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CERBERUS_TEST_POSTGRES_URL: postgresql://cerberus:citest@127.0.0.1:5432/cerberus
      CERBERUS_TEST_CLICKHOUSE_URL: http://cerberus:citest@127.0.0.1:8123/cerberus
      CERBERUS_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_backends.py

  deployments:
    name: validate deployments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for the Compose files to refer to
        run: python deploy/make-secrets.py north south
      - name: Standalone (docker-compose.yml)
        run: docker compose -f docker-compose.yml config -q
      - name: Compose (console, site, demo)
        env:
          CENTRAL_DOMAIN: cerberus.example.com
          CERBERUS_SITE_NAME: north
          CERBERUS_CENTRAL_URL: https://cerberus.example.com
        run: |
          for f in central site demo; do docker compose -f deploy/compose/$f.yml config -q; done
      - name: Swarm
        env:
          CENTRAL_DOMAIN: cerberus.example.com
        run: |
          docker stack config -c deploy/swarm/stack.yml > /dev/null
          CADDYFILE=Caddyfile.internal docker stack config -c deploy/swarm/stack.yml > /dev/null
      - name: Kubernetes
        run: |
          for k in standalone site central; do kubectl kustomize deploy/kubernetes/$k > /dev/null; done
          # Each layer with the clustered-storage component.
          for k in standalone site central; do
            mkdir -p /tmp/k/$k
            printf 'resources: [%s]\ncomponents: [%s]\n' "$PWD/deploy/kubernetes/$k" \
              "$PWD/deploy/kubernetes/components/clustered-storage" > /tmp/k/$k/kustomization.yaml
            kubectl kustomize --load-restrictor LoadRestrictionsNone /tmp/k/$k | grep -q CERBERUS_CLICKHOUSE_URL_FILE
          done
      - name: Compose with clustered storage
        run: |
          python deploy/make-secrets.py --storage
          docker compose -f deploy/compose/clustered-storage.yml config -q

  image:
    needs: [test, clustered-storage, deployments]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerberus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every push builds the image; only version tags publish it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
