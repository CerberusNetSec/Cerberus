# HAProxy in front of Cerberus collectors and processors (scale-out.yml).
#
# Syslog over TCP is spread over the collectors by connection; each connection
# starts with a PROXY protocol v2 header carrying the device's real address,
# which collectors accept only from HAProxy's address (CERBERUS_PROXY_PROTOCOL_FROM).
# Docker's DNS returns every collector replica for the name "collector"; the
# resolvers section re-reads it, so scaling up or down is picked up.
#
# The dashboard (port 8080) goes to whichever processor is active: a standby
# answers 503 at /readyz, so only the active one is in rotation, and after a
# takeover the new one is within a few seconds.

global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h      # devices keep syslog connections open for a long time
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend syslog_tcp
    bind :514
    default_backend collectors

# Syslog over TLS (RFC 5425): terminate it here and pass plain TCP on.
# Mount a PEM with certificate and key, publish 6514, and uncomment:
# frontend syslog_tls
#     bind :6514 ssl crt /usr/local/etc/haproxy/syslog.pem
#     default_backend collectors

frontend dashboard
    bind :8080
    mode http
    option httplog
    timeout client 60s
    default_backend processors

backend processors
    mode http
    timeout server 60s
    timeout connect 2s
    timeout check 2s
    retries 2
    option redispatch  # a request to a processor that just died goes to another
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    server-template processor 1-4 processor:8080 check resolvers docker init-addr none

backend collectors
    balance leastconn
    # Health check on the collector's status port; a stopped collector leaves rotation.
    option httpchk GET /healthz
    server-template collector 1-16 collector:5514 check port 8080 send-proxy-v2 resolvers docker init-addr none
