# Scale-out on one host: HAProxy in front of several collectors, a Kafka-compatible
# bus (Redpanda), detection workers, one processor (device detectors, alerts, the
# dashboard), PostgreSQL and ClickHouse. A template for spreading the same services
# over several hosts.
#
#   python deploy/make-secrets.py --storage
#   docker compose -f deploy/compose/scale-out.yml up -d --build --scale collector=3
#
# Two processors run: one active, one standby that takes over within seconds if
# the active one stops (leadership is a lock in PostgreSQL). HAProxy sends the
# dashboard to the active one. Prometheus metrics: :8080/metrics on every
# Cerberus container (set CERBERUS_METRICS_TOKEN to require a token).
#
# Detection workers: one service per family of detectors (by source address, target
# host, address pair, port, account), each scalable on its own, e.g.
# --scale detector-source=4. Collectors send each family the events it reads, divided
# by its key. To keep all detection in the processor instead, set
# CERBERUS_DETECTION_WORKERS= (empty) and start the stack without the detector-*
# services (list the others after "up").
#
# Dashboard: http://localhost:8080 (password: deploy/secrets/storage_password.txt).
# Syslog: TCP 514 into HAProxy, which spreads connections over the collectors and
# tells them each device's real address with a PROXY protocol v2 header. For TLS,
# terminate it at HAProxy (see haproxy.cfg). UDP is not load-balanced here: send
# TCP, or point UDP devices at collectors directly (Kubernetes does balance UDP;
# see deploy/README.md).
name: cerberus-scale

x-cerberus: &cerberus
  image: ${CERBERUS_IMAGE:-cerberus:latest}
  restart: unless-stopped
  read_only: true
  secrets: [postgres_url, clickhouse_url]

x-bus: &bus
  CERBERUS_KAFKA_BOOTSTRAP: redpanda:9092
  CERBERUS_POSTGRES_URL_FILE: /run/secrets/postgres_url
  CERBERUS_CLICKHOUSE_URL_FILE: /run/secrets/clickhouse_url
  CERBERUS_DEVICE_IDENTITY: ${CERBERUS_DEVICE_IDENTITY:-ip}
  # The same on collectors, workers and the processor: which families workers run.
  CERBERUS_DETECTION_WORKERS: ${CERBERUS_DETECTION_WORKERS-all}
  TZ: ${TZ:-UTC}

x-detector: &detector
  <<: *cerberus
  depends_on:
    redpanda: {condition: service_healthy}
    postgres: {condition: service_healthy}
    clickhouse: {condition: service_healthy}
  volumes: [spool:/data]  # alert candidates wait here while the bus is unreachable
  networks: [backend]

services:
  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    depends_on: [collector, processor]
    ports:
      - "514:514/tcp"
      - "8080:8080"  # the dashboard, on the active processor
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      ingest: {ipv4_address: 172.29.10.10}

  collector:
    <<: *cerberus
    build: ../..
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      <<: *bus
      CERBERUS_MODE: collector
      CERBERUS_SYSLOG_UDP_PORT: "0"
      CERBERUS_PROXY_PROTOCOL_FROM: 172.29.10.10  # only HAProxy may say who a device is
    volumes: [spool:/data]  # events wait here while the bus is unreachable
    networks: [ingest, backend]

  processor:
    <<: *cerberus
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      <<: *bus
      CERBERUS_MODE: processor
      CERBERUS_PASSWORD_FILE: /run/secrets/dashboard_password
      CERBERUS_MAX_EVENTS: ${CERBERUS_MAX_EVENTS:-50000000}
      CERBERUS_RETENTION_DAYS: ${CERBERUS_RETENTION_DAYS:-30}
    secrets: [postgres_url, clickhouse_url, dashboard_password]
    deploy:
      replicas: 2  # one active, one standby
    healthcheck:
      # Alive, not ready: a standby is healthy too.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      start_period: 20s
    tmpfs: ["/data:uid=10001,gid=10001"]
    networks: [ingest, backend]

  detector-source:
    <<: *detector
    environment: {<<: *bus, CERBERUS_MODE: detector, CERBERUS_DETECTION_FAMILY: source}
  detector-target:
    <<: *detector
    environment: {<<: *bus, CERBERUS_MODE: detector, CERBERUS_DETECTION_FAMILY: target}
  detector-pair:
    <<: *detector
    environment: {<<: *bus, CERBERUS_MODE: detector, CERBERUS_DETECTION_FAMILY: pair}
  detector-port:
    <<: *detector
    environment: {<<: *bus, CERBERUS_MODE: detector, CERBERUS_DETECTION_FAMILY: port}
  detector-account:
    <<: *detector
    environment: {<<: *bus, CERBERUS_MODE: detector, CERBERUS_DETECTION_FAMILY: account}

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command: >-
      redpanda start --mode dev-container --smp 1 --memory 1G
      --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerberus
      POSTGRES_DB: cerberus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cerberus"]
      interval: 5s
      retries: 30
    networks: [backend]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: cerberus
      CLICKHOUSE_DB: cerberus
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: [clickhouse_password]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user cerberus --password \"$$(cat /run/secrets/clickhouse_password)\" --query 'SELECT 1'"]
      interval: 5s
      retries: 30
    networks: [backend]

networks:
  ingest:
    ipam:
      config: [{subnet: 172.29.10.0/24}]
  backend:

secrets:
  dashboard_password: {file: "${CERBERUS_SECRETS_DIR:-../secrets}/storage_password.txt"}
  postgres_password: {file: "${CERBERUS_SECRETS_DIR:-../secrets}/storage_postgres_password.txt"}
  clickhouse_password: {file: "${CERBERUS_SECRETS_DIR:-../secrets}/storage_clickhouse_password.txt"}
  postgres_url: {file: "${CERBERUS_SECRETS_DIR:-../secrets}/storage_postgres_url.txt"}
  clickhouse_url: {file: "${CERBERUS_SECRETS_DIR:-../secrets}/storage_clickhouse_url.txt"}

volumes:
  spool:
  redpanda-data:
  postgres-data:
  clickhouse-data:
