{{- if and .Values.auth.password (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.authSecret" . }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.password | quote }}
---
{{- end }}
{{- if and (include "cerberus.clustered" .) (not .Values.storage.existingSecret) (not (include "cerberus.urlsFrom" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.storageSecret" . }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-url: {{ required "storage.postgresUrl (or storage.existingSecret) is required for clustered storage and scaleOut" .Values.storage.postgresUrl | quote }}
  clickhouse-url: {{ required "storage.clickhouseUrl (or storage.existingSecret) is required for clustered storage and scaleOut" .Values.storage.clickhouseUrl | quote }}
---
{{- end }}
{{- if and (eq .Values.mode "scaleOut") (include "cerberus.sasl" .) (not .Values.kafka.sasl.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.kafkaSecret" . }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.kafka.sasl.passwordKey }}: {{ required "kafka.sasl.password (or kafka.sasl.existingSecret) is required for SASL" .Values.kafka.sasl.password | quote }}
---
{{- end }}
{{- if and .Values.oidc.issuer (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.oidcSecret" . }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
---
{{- end }}
{{- if and .Values.federation.site.consoleUrl (not .Values.federation.site.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.siteSecret" . }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "federation.site.token (or federation.site.existingSecret) is required to report to a console" .Values.federation.site.token | quote }}
---
{{- end }}
{{- if .Values.metrics.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-metrics" (include "cerberus.fullname" .) }}
  labels: {{- include "cerberus.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.metrics.token | quote }}
{{- end }}
