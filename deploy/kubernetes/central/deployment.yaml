apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-central
  labels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: console}
spec:
  replicas: 1  # one SQLite writer; do not scale
  strategy: {type: Recreate}  # never two pods on the same volume during an update
  selector:
    matchLabels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: console}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cerberus
          image: cerberus
          envFrom:
            - configMapRef: {name: cerberus-central}
          env:
            - {name: CERBERUS_PASSWORD_FILE, value: /run/secrets/cerberus/password}
            - {name: CERBERUS_SITE_TOKENS_FILE, value: /run/secrets/cerberus/site-tokens}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: secrets, mountPath: /run/secrets/cerberus, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cerberus-central-data}
        - name: secrets
          secret: {secretName: cerberus-central, defaultMode: 0440}  # group-readable: fsGroup gives the pod that group
