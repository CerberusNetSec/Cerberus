# The central console: receives site reports; collects no syslog itself.
#
#   python deploy/make-secrets.py north south
#   kubectl create namespace cerberus-central
#   kubectl -n cerberus-central create secret generic cerberus \
#     --from-file=password=deploy/secrets/central_password.txt \
#     --from-file=site-tokens=deploy/secrets/site_tokens.txt
#   kubectl apply -k deploy/kubernetes/central
#
# Set the host name below and in ingress.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerberus-central
resources:
  - ../base
  - ingress.yaml
configMapGenerator:
  - name: cerberus
    behavior: merge
    literals:
      - CERBERUS_CENTRAL=on
      - CERBERUS_PUBLIC_URL=https://cerberus.example.com
      - CERBERUS_SITE_SILENT_MINUTES=5
      - CERBERUS_SYSLOG_UDP_PORT=0
      - CERBERUS_SYSLOG_TCP_PORT=0
patches:
  - target: {kind: Deployment, name: cerberus}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CERBERUS_SITE_TOKENS_FILE, value: /run/secrets/cerberus/site-tokens}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
  # The console stores alerts and summaries, not events: it needs little disk.
  - target: {kind: PersistentVolumeClaim, name: cerberus-data}
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  # No syslog here, so no load balancer for it.
  - target: {kind: Service, name: cerberus-syslog}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: cerberus-syslog
