# One Deployment per family of detectors. Scale each by its replicas; the
# family's topic has CERBERUS_KAFKA_PARTITIONS partitions, so more replicas than
# that would sit idle. Workers keep their windows in memory: a replaced pod's keys
# start their windows again on the pod that takes them over.
---
# source: keyed by source address: scans, sweeps, floods, guessing, egress, beacons.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-detector-source
  labels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: detector-source}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: detector-source}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cerberus, app.kubernetes.io/component: detector-source}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: detector
          image: cerberus
          envFrom:
            - configMapRef: {name: cerberus-detector}
          env:
            - {name: CERBERUS_DETECTION_FAMILY, value: source}
            - name: CERBERUS_COLLECTOR_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: CERBERUS_POSTGRES_URL_FILE, value: /run/secrets/storage/postgres-url}
            - {name: CERBERUS_CLICKHOUSE_URL_FILE, value: /run/secrets/storage/clickhouse-url}
          ports:
            - {name: status, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: status}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: status}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 1, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}  # one core each; add replicas rather than CPU
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}  # spool for alert candidates during a bus outage
            - {name: storage, mountPath: /run/secrets/storage, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: storage
          secret: {secretName: cerberus-storage, defaultMode: 0440}
---
