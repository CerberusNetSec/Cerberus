# The processor: reads events from the bus and does recording, detection,
# alerting, notifications and the dashboard. Two replicas: one active, one
# standby that takes over within seconds (a lock in PostgreSQL decides). The
# standby is not ready (503 at /readyz), so the Service sends the dashboard
# to the active one. With detector/, the
# detection that keys on sources, targets, pairs, ports and accounts runs in the
# workers and the processor turns their findings into alerts; set
# CERBERUS_DETECTION_WORKERS below to the same families (all). Needs clustered
# storage, which this layer includes.
#
#   kubectl -n cerberus create secret generic cerberus --from-literal=password='choose-one'
#   kubectl -n cerberus create secret generic cerberus-storage \
#     --from-literal=postgres-url=... --from-literal=clickhouse-url=...
#   kubectl apply -k deploy/kubernetes/processor
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerberus
resources:
  - ../base
components:
  - ../components/clustered-storage
configMapGenerator:
  - name: cerberus
    behavior: merge
    literals:
      - CERBERUS_MODE=processor
      - CERBERUS_KAFKA_BOOTSTRAP=cerberus-kafka-bootstrap.kafka.svc:9092
      - CERBERUS_SYSLOG_UDP_PORT=0
      - CERBERUS_SYSLOG_TCP_PORT=0
      # With detector/: the same families as there (all).
      - CERBERUS_DETECTION_WORKERS=
patches:
  # Active/standby: two replicas, readiness only on the active one.
  - target: {kind: Deployment, name: cerberus}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy
        value: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /readyz, port: http}, periodSeconds: 3, failureThreshold: 1}
      - op: add
        path: /spec/template/metadata/annotations
        value: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
  # Syslog goes to the collectors, not here.
  - target: {kind: Service, name: cerberus-syslog}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: cerberus-syslog
