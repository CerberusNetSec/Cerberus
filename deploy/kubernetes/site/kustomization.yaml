# One site. Apply once per site, in that site's cluster, with its own name.
#
#   kubectl create namespace cerberus
#   kubectl -n cerberus create secret generic cerberus-site \
#     --from-file=password=deploy/secrets/north_password.txt \
#     --from-file=central-token=deploy/secrets/north.token
#   kubectl apply -k deploy/kubernetes/site
#
# Set the site name and console URL below (they must match make-secrets.py and
# the console's address). For several sites in one cluster, copy this folder
# per site and give each its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerberus
labels:
  - pairs: {app.kubernetes.io/part-of: cerberus}
    includeSelectors: false
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: cerberus
    newName: registry.example.com/cerberus
    newTag: "0.2.0"
configMapGenerator:
  - name: cerberus-site
    literals:
      - CERBERUS_SITE_NAME=north
      - CERBERUS_CENTRAL_URL=https://cerberus.example.com
      # Source addresses survive because the syslog Service uses
      # externalTrafficPolicy: Local. If your load balancer still rewrites them,
      # switch to hostname.
      - CERBERUS_DEVICE_IDENTITY=ip
      # - CERBERUS_MAX_EVENTS=20000000
      # - CERBERUS_TRAFFIC_SAMPLE=20
