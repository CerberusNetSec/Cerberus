# A site: collects syslog and reports to a central console.
# Apply once per site, in that site's cluster or its own namespace.
#
#   python deploy/make-secrets.py north
#   kubectl create namespace cerberus
#   kubectl -n cerberus create secret generic cerberus \
#     --from-file=password=deploy/secrets/north_password.txt \
#     --from-file=central-token=deploy/secrets/north.token
#   kubectl apply -k deploy/kubernetes/site
#
# Set the site name (as given to make-secrets.py) and the console's URL below.
# For several sites in one cluster, copy this folder per site and change the
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cerberus
resources:
  - ../base
configMapGenerator:
  - name: cerberus
    behavior: merge
    literals:
      - CERBERUS_SITE_NAME=north
      - CERBERUS_CENTRAL_URL=https://cerberus.example.com
      # Only for a console behind a private CA: add a ca.crt key to the
      # secret and uncomment.
      # - CERBERUS_CENTRAL_CA=/run/secrets/cerberus/ca.crt
patches:
  - target: {kind: Deployment, name: cerberus}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CERBERUS_CENTRAL_TOKEN_FILE, value: /run/secrets/cerberus/central-token}
