apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerberus-site-data
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: fast-ssd   # SQLite wants local or block storage, not NFS
  resources:
    requests:
      storage: 50Gi  # about 850 bytes per stored event; size to CERBERUS_MAX_EVENTS
