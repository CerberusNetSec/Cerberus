services:
  cerberus:
    build: .
    image: cerberus:latest
    container_name: cerberus
    restart: unless-stopped
    ports:
      - "514:5514/udp"   # syslog from your devices (on Docker Desktop for Windows, send TCP: external UDP may not arrive)
      - "514:5514/tcp"
      - "8080:8080"      # dashboard
      # - "2055:2055/udp" # NetFlow v5/v9 and IPFIX, with CERBERUS_FLOW_PORT: 2055 below
      # SNMP polling is outbound (to UDP 161 on your devices) and needs no port here.
    environment:
      # Dashboard password. If unset, one is generated and printed once in `docker logs cerberus`.
      CERBERUS_PASSWORD: ${CERBERUS_PASSWORD:-}
      # Used for links in notifications, e.g. http://192.168.1.10:8080
      CERBERUS_PUBLIC_URL: ${CERBERUS_PUBLIC_URL:-}
      CERBERUS_RETENTION_DAYS: 7
      # ip, or hostname where Docker rewrites source addresses (see the note below)
      CERBERUS_DEVICE_IDENTITY: ${CERBERUS_DEVICE_IDENTITY:-ip}
      # For busy networks (see "Running at scale" in the README):
      # CERBERUS_MAX_EVENTS: 20000000     # about 850 bytes each, so ~17 GB
      # CERBERUS_TRAFFIC_SAMPLE: 20       # store 1 in 20 allowed connections; everything is still analysed
      # CERBERUS_FLOW_PORT: 2055          # receive NetFlow/IPFIX (publish the port above too)
      TZ: ${TZ:-UTC}
    volumes:
      - cerberus-data:/data

    # Devices are told apart by source IP. Docker's bridge network keeps the real
    # source address on Linux, but Docker Desktop (Windows/macOS) and rootless
    # Docker rewrite it, so every device would look like one. If that happens,
    # either run on Linux with host networking:
    #   network_mode: host        (and remove the `ports:` section; set
    #                              CERBERUS_SYSLOG_UDP_PORT / _TCP_PORT if 5514 is not what you want)
    # or tell devices apart by the hostname in the syslog header instead:
    #   CERBERUS_DEVICE_IDENTITY=hostname   (in .env)

volumes:
  cerberus-data:
